name: Build Hikawati APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Unzip Android Source
      run: unzip hikawati_android_source.zip -d ./source_code

    - name: Find Android Directory
      run: |
        DIR=$(find ./source_code -name "gradlew" -printf '%h\n' | head -n 1)
        echo "ANDROID_DIR=$DIR" >> $GITHUB_ENV

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Make gradlew executable
      run: chmod +x ${{ env.ANDROID_DIR }}/gradlew

    - name: Build with Gradle
      working-directory: ${{ env.ANDROID_DIR }}
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Hikawati-Debug-APK
        path: ${{ env.ANDROID_DIR }}/app/build/outputs/apk/debug/app-debug.apk
