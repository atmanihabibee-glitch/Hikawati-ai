name: Build Hikawati APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Unzip and Find
      run: |
        unzip hikawati_android_source.zip -d ./source_code
        DIR=$(find ./source_code -name "build.gradle" -type f | head -n 1 | xargs dirname)
        echo "ANDROID_DIR=$DIR" >> $GITHUB_ENV

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Build with Gradle
      run: |
        cd ${{ env.ANDROID_DIR }}
        # توليد ملف gradlew بنسخة متوافقة مع المشروع القديم
        gradle wrapper --gradle-version 7.4.2
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Hikawati-Debug-APK
        path: ${{ env.ANDROID_DIR }}/app/build/outputs/apk/debug/*.apk
