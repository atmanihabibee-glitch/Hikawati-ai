name: Build Hikawati APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Unzip and Find
      run: |
        unzip hikawati_android_source.zip -d ./source_code
        cd ./source_code
        DIR=$(find . -name "gradlew" -type f | head -n 1 | xargs dirname)
        echo "ANDROID_DIR=$DIR" >> $GITHUB_ENV

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build with Gradle
      run: |
        cd ${{ env.ANDROID_DIR }}
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Hikawati-Debug-APK
        path: ./source_code/**/build/outputs/apk/debug/*.apk
