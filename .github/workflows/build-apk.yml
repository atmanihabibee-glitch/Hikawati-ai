name: Build Hikawati APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Unzip Source
      run: unzip hikawati_android_source.zip -d ./source_code

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Make gradlew executable
      run: chmod +x ./source_code/hikawati_android/gradlew

    - name: Build with Gradle
      working-directory: ./source_code/hikawati_android
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Hikawati-Debug-APK
        path: ./source_code/hikawati_android/app/build/outputs/apk/debug/app-debug.apk
