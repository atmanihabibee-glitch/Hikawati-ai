name: Build Hikawati APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Unzip and Find
      run: |
        unzip hikawati_android_source.zip -d ./source_code
        DIR=$(find ./source_code -name "build.gradle" -type f | head -n 1 | xargs dirname)
        echo "ANDROID_DIR=$DIR" >> $GITHUB_ENV

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build with Gradle
      uses: gradle/gradle-build-action@v2
      with:
        gradle-version: '8.7'
        arguments: assembleDebug
        build-root-directory: ${{ env.ANDROID_DIR }}

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Hikawati-Debug-APK
        # التعديل هنا: البحث عن أي ملف ينتهي بـ apk في كل المشروع
        path: ./source_code/**/*.apk
