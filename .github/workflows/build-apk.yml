
name: Build Hikawati APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'hikawati_android_source.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          unzip -o hikawati_android_source.zip -d project
          find project -name gradlew -type f

      - name: Build APK
        run: |
          cd project
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hikawati-APK
          path: project/**/build/outputs/apk/debug/*.apk
